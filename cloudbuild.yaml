steps:
  # Build and push server image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scheduler-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scheduler-api:latest'
      - '-f'
      - 'deploy/Dockerfile.server'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scheduler-api:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scheduler-api:latest']

  # Build and push client image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scheduler-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scheduler-web:latest'
      - '-f'
      - 'deploy/Dockerfile.client'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scheduler-web:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scheduler-web:latest']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'scheduler-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/scheduler-api:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-secrets'
      - 'GOOGLE_SHEETS_CREDENTIALS=scheduler-google-credentials:latest,FIREBASE_SERVICE_ACCOUNT=scheduler-firebase-credentials:latest'
      - '--set-env-vars'
      - 'GOOGLE_SPREADSHEET_ID=${_SPREADSHEET_ID},NODE_ENV=production,CORS_ORIGIN=${_WEB_URL}'

  # Deploy Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'scheduler-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/scheduler-web:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'

images:
  - 'gcr.io/$PROJECT_ID/scheduler-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/scheduler-api:latest'
  - 'gcr.io/$PROJECT_ID/scheduler-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/scheduler-web:latest'

substitutions:
  _REGION: us-central1
  _API_URL: https://scheduler-api-HASH-uc.a.run.app
  _WEB_URL: https://scheduler-web-HASH-uc.a.run.app
  _SPREADSHEET_ID: YOUR_SPREADSHEET_ID
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_STORAGE_BUCKET: ''
  _FIREBASE_MESSAGING_SENDER_ID: ''
  _FIREBASE_APP_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
